name: Test and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-gudev-1.0 gir1.2-ayatanaappindicator3-0.1 gir1.2-notify-0.7 librsvg2-common desktop-file-utils xvfb dbus-x11 gitleaks polkitd pkexec
      - name: Unit tests and publication checks
        run: |
          make test privacy
          /usr/bin/python3 scripts/scan_secrets.py --history
      - name: Build and inspect
        run: |
          make deb
          dpkg-deb -x dist/*.deb /tmp/package-check
          /usr/bin/python3 -B scripts/import_check.py --root /tmp/package-check/usr/share/system-device-monitor
          /usr/bin/python3 scripts/privacy_check.py --tree /tmp/package-check
          /usr/bin/python3 scripts/scan_secrets.py --tree /tmp/package-check
          desktop-file-validate /tmp/package-check/usr/share/applications/system-device-monitor.desktop
      - name: Install, run, upgrade
        run: |
          sudo apt-get install -y ./dist/*.deb
          /usr/bin/system-device-monitor --version
          xvfb-run -a dbus-run-session -- /usr/bin/system-device-monitor --smoke-test --output-dir /tmp/monitor-smoke
          sudo apt-get install -y --reinstall ./dist/*.deb
      - name: Admin components
        run: |
          set -eu
          helper=/usr/libexec/system-device-monitor/sdm-cpu-power
          service=/usr/libexec/system-device-monitor/sdm-cpu-power-service
          units=/usr/lib/systemd/system/system-device-monitor-cpu-power
          expect() {
            want=$1; shift
            set +e; "$@"; got=$?; set -e
            if [ "$got" != "$want" ]; then echo "expected exit $want, got $got: $*"; exit 1; fi
          }
          for path in "$helper" "$service"; do
            test "$(stat -c '%U %a' "$path")" = "root 755"
          done
          for path in /usr/share/polkit-1/actions/tw.local.system-device-monitor.policy "$units.socket" "$units.service"; do
            test "$(stat -c '%U %a' "$path")" = "root 644"
          done
          pkaction --verbose --action-id tw.local.system-device-monitor.cpu-power | tee /tmp/pkaction.txt
          grep -Eq 'implicit any: *no$' /tmp/pkaction.txt
          grep -Eq 'implicit inactive: *no$' /tmp/pkaction.txt
          grep -Eq 'implicit active: *auth_admin$' /tmp/pkaction.txt
          systemd-analyze verify "$units.socket" "$units.service"
          systemd-analyze security --offline=true --threshold=10 "$units.service"
          test "$(systemctl is-enabled system-device-monitor-cpu-power.socket || true)" = "disabled"
          expect 0 "$helper" --protocol
          expect 2 sudo "$helper"
          expect 2 sudo "$helper" bogus
          expect 2 sudo "$helper" enable extra
          expect 2 sudo "$helper" --protocol extra
          expect 4 sudo "$helper" status
          expect 4 "$helper" enable
          expect 2 sudo "$service" --protocol
          expect 4 sudo "$service"
          expect 4 "$service"
          # 以 sudo 模擬 pkexec：開啟、連線確認服務以動態帳號執行且沒有任何能力，再關閉
          sudo env PKEXEC_UID="$(id -u)" "$helper" enable
          test "$(stat -c '%U %a' /run/system-device-monitor/cpu-power.sock)" = "$(id -un) 600"
          /usr/bin/python3 - <<'EOF'
          import json, socket, subprocess
          sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          sock.settimeout(20)
          sock.connect("/run/system-device-monitor/cpu-power.sock")
          sock.sendall(b"r\n")
          data = b""
          while not data.endswith(b"\n"):
              chunk = sock.recv(256)
              assert chunk, "service closed the connection"
              data += chunk
          reply = json.loads(data)
          print(reply)
          assert reply["v"] == 1 and reply["status"] in ("sampling", "error"), reply
          pid = subprocess.check_output(["systemctl", "show", "-p", "MainPID", "--value",
                                         "system-device-monitor-cpu-power.service"], text=True).strip()
          assert pid != "0", "service is not running"
          status = open(f"/proc/{pid}/status").read()
          fields = dict(line.split(":", 1) for line in status.splitlines() if ":" in line)
          caps = ("CapInh", "CapPrm", "CapEff", "CapBnd", "CapAmb")
          print({key: fields[key].strip() for key in ("Uid", "Gid", "Groups", "NoNewPrivs") + caps})
          uids = {int(value) for value in fields["Uid"].split()}
          gids = {int(value) for value in fields["Gid"].split()}
          assert len(uids) == 1 and len(gids) == 1, (uids, gids)
          uid = uids.pop()
          assert 61184 <= uid <= 65519, uid
          assert all(int(fields[key], 16) == 0 for key in caps), fields
          assert fields["NoNewPrivs"].strip() == "1"
          user = subprocess.check_output(["ps", "-o", "user=", "-p", pid], text=True).strip()
          assert user == "sdm-cpu-power", user
          EOF
          sudo env PKEXEC_UID="$(id -u)" "$helper" status | grep -q '"enabled":true'
          sudo env PKEXEC_UID="$(id -u)" "$helper" disable
          test ! -e /run/system-device-monitor/cpu-power.sock
          test ! -e /etc/systemd/system/system-device-monitor-cpu-power.socket.d
          # 開著移除套件：prerm 必須停用並清除
          sudo env PKEXEC_UID="$(id -u)" "$helper" enable
      - name: Charge limit components
        run: |
          set -eu
          limit=/usr/libexec/system-device-monitor/sdm-charge-limit
          limit_unit=/usr/lib/systemd/system/system-device-monitor-charge-limit.service
          limit_policy=/usr/share/polkit-1/actions/tw.local.system-device-monitor.unattended.charge-limit.policy
          expect() {
            want=$1; shift
            set +e; "$@"; got=$?; set -e
            if [ "$got" != "$want" ]; then echo "expected exit $want, got $got: $*"; exit 1; fi
          }
          as_user() { sudo env PKEXEC_UID="$(id -u)" "$limit" "$@"; }
          test "$(stat -c '%U %a' "$limit")" = "root 755"
          for path in "$limit_policy" "$limit_unit"; do
            test "$(stat -c '%U %a' "$path")" = "root 644"
          done
          pkaction --verbose --action-id tw.local.system-device-monitor.unattended.charge-limit | tee /tmp/pkaction-limit.txt
          grep -Eq 'implicit any: *no$' /tmp/pkaction-limit.txt
          grep -Eq 'implicit inactive: *no$' /tmp/pkaction-limit.txt
          grep -Eq 'implicit active: *auth_admin_keep$' /tmp/pkaction-limit.txt
          systemd-analyze verify "$limit_unit"
          systemd-analyze security --offline=true --threshold=10 "$limit_unit"
          test "$(systemctl is-enabled system-device-monitor-charge-limit.service || true)" = "disabled"
          expect 0 "$limit" --protocol
          # 參數錯誤一律結束碼 2（$args 刻意不加引號，以空白分成多個參數）
          for args in "set" "set BAT0" "set BAT0 49" "set BAT0 101" "set BAT0 -80" "set BAT0 79.5" \
                      "set BAT0 8e1" "set BAT0 080" "set BAT0 1e2" "set BAT0/../x 80" "set bat-0 80" \
                      "set BAT0 80 --start 80" "set BAT0 80 --start 90" "set BAT0 80 --persist maybe" \
                      "set BAT0 80 --persist on --persist off" "restore" "bogus"; do
            expect 2 as_user $args
          done
          expect 2 as_user set BAT0 " 80"
          expect 2 as_user set "BAT0 " 80
          expect 2 as_user set "" 80
          expect 2 as_user set BAT0 ""
          # 執行器沒有電池：結束碼必須是 2 或 3，標準輸出剛好一行 JSON
          set +e; out=$(as_user set BAT0 80); got=$?; set -e
          case "$got" in 2|3) ;; *) echo "unexpected exit $got: $out"; exit 1;; esac
          printf '%s\n' "$out" | /usr/bin/python3 -c 'import json,sys; lines=sys.stdin.read().splitlines(); assert len(lines)==1, lines; value=json.loads(lines[0]); assert value["ok"] is False, value; print(value)'
          as_user status | /usr/bin/python3 -c 'import json,sys; value=json.loads(sys.stdin.read()); assert value["ok"] and value["enabled"] is False and value["persist"] is None, value; print(value)'
          expect 4 "$limit" set BAT0 80
          expect 4 sudo "$limit" set BAT0 80
          expect 4 sudo "$limit" restore --from-unit
          expect 4 sudo env PKEXEC_UID="$(id -u)" INVOCATION_ID=0123456789abcdef0123456789abcdef "$limit" restore --from-unit
          test ! -e /var/lib/system-device-monitor
          # 在真正的 systemd 中執行重新套用（以 root 寫入一個保留值）：執行器沒有電池，略過但必須成功
          sudo install -d -m 0755 /var/lib/system-device-monitor
          printf '%s\n' '{"end": 80, "format": 1, "supply": "BAT0"}' | sudo tee /var/lib/system-device-monitor/charge-limit.json >/dev/null
          sudo systemctl start system-device-monitor-charge-limit.service
          test "$(systemctl show -p Result --value system-device-monitor-charge-limit.service)" = "success"
          test "$(systemctl show -p ExecMainStatus --value system-device-monitor-charge-limit.service)" = "0"
          # 保留的值留著：移除套件時 prerm 必須刪除它
      - name: Remove and purge
        run: |
          set -eu
          sudo apt-get remove -y system-device-monitor
          test ! -e /var/lib/system-device-monitor/charge-limit.json
          test ! -e /run/system-device-monitor/charge-limit.lock
          test ! -e /usr/bin/system-device-monitor
          test ! -e /usr/lib/systemd/system/system-device-monitor-cpu-power.socket
          test ! -e /usr/lib/systemd/system/system-device-monitor-cpu-power.service
          test ! -e /etc/systemd/system/system-device-monitor-cpu-power.socket.d
          test ! -e /etc/systemd/system/sockets.target.wants/system-device-monitor-cpu-power.socket
          test ! -e /usr/lib/systemd/system/system-device-monitor-charge-limit.service
          test ! -e /etc/systemd/system/multi-user.target.wants/system-device-monitor-charge-limit.service
          test ! -e /etc/systemd/system/sleep.target.wants/system-device-monitor-charge-limit.service
          test ! -e /run/system-device-monitor/cpu-power.sock
          test "$(systemctl is-active system-device-monitor-cpu-power.socket || true)" != "active"
          sudo apt-get purge -y system-device-monitor
          test ! -e /var/lib/system-device-monitor
          test ! -e /usr/share/polkit-1/actions/tw.local.system-device-monitor.policy
          test ! -e /usr/share/polkit-1/actions/tw.local.system-device-monitor.unattended.charge-limit.policy
          test ! -e /usr/libexec/system-device-monitor
          if ls /etc/polkit-1/rules.d 2>/dev/null | grep -q system-device-monitor; then exit 1; fi
          if dpkg-query -W system-device-monitor 2>/dev/null; then exit 1; fi
