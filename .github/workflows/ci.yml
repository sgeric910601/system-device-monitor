name: Test and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-gudev-1.0 gir1.2-ayatanaappindicator3-0.1 gir1.2-notify-0.7 librsvg2-common desktop-file-utils xvfb dbus-x11 gitleaks polkitd pkexec
      - name: Unit tests and publication checks
        run: |
          make test privacy
          /usr/bin/python3 scripts/scan_secrets.py --history
      - name: Build and inspect
        run: |
          make deb
          dpkg-deb -x dist/*.deb /tmp/package-check
          /usr/bin/python3 -B scripts/import_check.py --root /tmp/package-check/usr/share/system-device-monitor
          /usr/bin/python3 scripts/privacy_check.py --tree /tmp/package-check
          /usr/bin/python3 scripts/scan_secrets.py --tree /tmp/package-check
          desktop-file-validate /tmp/package-check/usr/share/applications/system-device-monitor.desktop
      - name: Install, run, reinstall
        run: |
          sudo apt-get install -y ./dist/*.deb
          test "$(/usr/bin/system-device-monitor --version)" = "System Device Monitor $(cat VERSION)"
          xvfb-run -a dbus-run-session -- /usr/bin/system-device-monitor --smoke-test --output-dir /tmp/monitor-smoke
          sudo apt-get install -y --reinstall ./dist/*.deb
      - name: Admin components
        run: |
          set -eu
          helper=/usr/libexec/system-device-monitor/sdm-cpu-power
          service=/usr/libexec/system-device-monitor/sdm-cpu-power-service
          units=/usr/lib/systemd/system/system-device-monitor-cpu-power
          expect() {
            want=$1; shift
            set +e; "$@"; got=$?; set -e
            if [ "$got" != "$want" ]; then echo "expected exit $want, got $got: $*"; exit 1; fi
          }
          for path in "$helper" "$service"; do
            test "$(stat -c '%U %a' "$path")" = "root 755"
          done
          for path in /usr/share/polkit-1/actions/tw.local.system-device-monitor.policy "$units.socket" "$units.service"; do
            test "$(stat -c '%U %a' "$path")" = "root 644"
          done
          pkaction --verbose --action-id tw.local.system-device-monitor.cpu-power | tee /tmp/pkaction.txt
          grep -Eq 'implicit any: *no$' /tmp/pkaction.txt
          grep -Eq 'implicit inactive: *no$' /tmp/pkaction.txt
          grep -Eq 'implicit active: *auth_admin$' /tmp/pkaction.txt
          systemd-analyze verify "$units.socket" "$units.service"
          systemd-analyze security --offline=true --threshold=10 "$units.service"
          test "$(systemctl is-enabled system-device-monitor-cpu-power.socket || true)" = "disabled"
          expect 0 "$helper" --protocol
          expect 2 sudo "$helper"
          expect 2 sudo "$helper" bogus
          expect 2 sudo "$helper" enable extra
          expect 2 sudo "$helper" --protocol extra
          expect 4 sudo "$helper" status
          expect 4 "$helper" enable
          expect 2 sudo "$service" --protocol
          expect 4 sudo "$service"
          expect 4 "$service"
          # 以 sudo 模擬 pkexec：開啟、連線確認服務以動態帳號執行且沒有任何能力，再關閉
          sudo env PKEXEC_UID="$(id -u)" "$helper" enable
          test "$(stat -c '%U %a' /run/system-device-monitor/cpu-power.sock)" = "$(id -un) 600"
          /usr/bin/python3 - <<'EOF'
          import json, socket, subprocess
          sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          sock.settimeout(20)
          sock.connect("/run/system-device-monitor/cpu-power.sock")
          sock.sendall(b"r\n")
          data = b""
          while not data.endswith(b"\n"):
              chunk = sock.recv(256)
              assert chunk, "service closed the connection"
              data += chunk
          reply = json.loads(data)
          print(reply)
          assert reply["v"] == 1 and reply["status"] in ("sampling", "error"), reply
          pid = subprocess.check_output(["systemctl", "show", "-p", "MainPID", "--value",
                                         "system-device-monitor-cpu-power.service"], text=True).strip()
          assert pid != "0", "service is not running"
          status = open(f"/proc/{pid}/status").read()
          fields = dict(line.split(":", 1) for line in status.splitlines() if ":" in line)
          caps = ("CapInh", "CapPrm", "CapEff", "CapBnd", "CapAmb")
          print({key: fields[key].strip() for key in ("Uid", "Gid", "Groups", "NoNewPrivs") + caps})
          uids = {int(value) for value in fields["Uid"].split()}
          gids = {int(value) for value in fields["Gid"].split()}
          assert len(uids) == 1 and len(gids) == 1, (uids, gids)
          uid = uids.pop()
          assert 61184 <= uid <= 65519, uid
          assert all(int(fields[key], 16) == 0 for key in caps), fields
          assert fields["NoNewPrivs"].strip() == "1"
          user = subprocess.check_output(["ps", "-o", "user=", "-p", pid], text=True).strip()
          assert user == "sdm-cpu-power", user
          EOF
          sudo env PKEXEC_UID="$(id -u)" "$helper" status | grep -q '"enabled":true'
          sudo env PKEXEC_UID="$(id -u)" "$helper" disable
          test ! -e /run/system-device-monitor/cpu-power.sock
          test ! -e /etc/systemd/system/system-device-monitor-cpu-power.socket.d
          # 開著移除套件：prerm 必須停用並清除
          sudo env PKEXEC_UID="$(id -u)" "$helper" enable
      - name: Charge limit components
        run: |
          set -eu
          limit=/usr/libexec/system-device-monitor/sdm-charge-limit
          limit_unit=/usr/lib/systemd/system/system-device-monitor-charge-limit.service
          limit_policy=/usr/share/polkit-1/actions/tw.local.system-device-monitor.unattended.charge-limit.policy
          expect() {
            want=$1; shift
            set +e; "$@"; got=$?; set -e
            if [ "$got" != "$want" ]; then echo "expected exit $want, got $got: $*"; exit 1; fi
          }
          as_user() { sudo env PKEXEC_UID="$(id -u)" "$limit" "$@"; }
          test "$(stat -c '%U %a' "$limit")" = "root 755"
          for path in "$limit_policy" "$limit_unit"; do
            test "$(stat -c '%U %a' "$path")" = "root 644"
          done
          pkaction --verbose --action-id tw.local.system-device-monitor.unattended.charge-limit | tee /tmp/pkaction-limit.txt
          grep -Eq 'implicit any: *no$' /tmp/pkaction-limit.txt
          grep -Eq 'implicit inactive: *no$' /tmp/pkaction-limit.txt
          grep -Eq 'implicit active: *auth_admin_keep$' /tmp/pkaction-limit.txt
          systemd-analyze verify "$limit_unit"
          systemd-analyze security --offline=true --threshold=10 "$limit_unit"
          test "$(systemctl is-enabled system-device-monitor-charge-limit.service || true)" = "disabled"
          expect 0 "$limit" --protocol
          # 參數錯誤一律結束碼 2（$args 刻意不加引號，以空白分成多個參數）
          for args in "set" "set BAT0" "set BAT0 49" "set BAT0 101" "set BAT0 -80" "set BAT0 79.5" \
                      "set BAT0 8e1" "set BAT0 080" "set BAT0 1e2" "set BAT0/../x 80" "set bat-0 80" \
                      "set BAT0 80 --start 80" "set BAT0 80 --start 90" "set BAT0 80 --persist maybe" \
                      "set BAT0 80 --persist on --persist off" "restore" "bogus"; do
            expect 2 as_user $args
          done
          expect 2 as_user set BAT0 " 80"
          expect 2 as_user set "BAT0 " 80
          expect 2 as_user set "" 80
          expect 2 as_user set BAT0 ""
          # 執行器沒有電池：結束碼必須是 2 或 3，標準輸出剛好一行 JSON
          set +e; out=$(as_user set BAT0 80); got=$?; set -e
          case "$got" in 2|3) ;; *) echo "unexpected exit $got: $out"; exit 1;; esac
          printf '%s\n' "$out" | /usr/bin/python3 -c 'import json,sys; lines=sys.stdin.read().splitlines(); assert len(lines)==1, lines; value=json.loads(lines[0]); assert value["ok"] is False, value; print(value)'
          as_user status | /usr/bin/python3 -c 'import json,sys; value=json.loads(sys.stdin.read()); assert value["ok"] and value["enabled"] is False and value["persist"] is None, value; print(value)'
          expect 4 "$limit" set BAT0 80
          expect 4 sudo "$limit" set BAT0 80
          expect 4 sudo "$limit" restore --from-unit
          expect 4 sudo env PKEXEC_UID="$(id -u)" INVOCATION_ID=0123456789abcdef0123456789abcdef "$limit" restore --from-unit
          test ! -e /var/lib/system-device-monitor
          # 在真正的 systemd 中執行重新套用（以 root 寫入一個保留值）：執行器沒有電池，略過但必須成功
          sudo install -d -m 0755 /var/lib/system-device-monitor
          printf '%s\n' '{"end": 80, "format": 1, "supply": "BAT0"}' | sudo tee /var/lib/system-device-monitor/charge-limit.json >/dev/null
          sudo systemctl start system-device-monitor-charge-limit.service
          test "$(systemctl show -p Result --value system-device-monitor-charge-limit.service)" = "success"
          test "$(systemctl show -p ExecMainStatus --value system-device-monitor-charge-limit.service)" = "0"
          # 保留的值留著：移除套件時 prerm 必須刪除它
      - name: Update helper
        run: |
          set -eu
          update=/usr/libexec/system-device-monitor/sdm-update
          test "$(stat -c '%U %a' "$update")" = "root 755"
          test "$(stat -c '%U %a' /usr/share/polkit-1/actions/tw.local.system-device-monitor.update.policy)" = "root 644"
          pkaction --verbose --action-id tw.local.system-device-monitor.update | tee /tmp/pkaction-update.txt
          grep -Eq 'implicit any: *no$' /tmp/pkaction-update.txt
          grep -Eq 'implicit inactive: *no$' /tmp/pkaction-update.txt
          grep -Eq 'implicit active: *auth_admin$' /tmp/pkaction-update.txt
          expect() {
            want=$1; shift
            set +e; "$@"; got=$?; set -e
            if [ "$got" != "$want" ]; then echo "expected exit $want, got $got: $*"; exit 1; fi
          }
          # 以 sudo 模擬 pkexec；小程式只信任內建的公鑰，所以這裡只測試會被拒絕的輸入
          fails() {
            want=$1; shift
            set +e; out=$(sudo env PKEXEC_UID="$(id -u)" "$update" install "$@"); got=$?; set -e
            echo "$out"
            if [ "$got" != 3 ]; then echo "expected exit 3, got $got: $*"; exit 1; fi
            case "$out" in *"\"reason\":\"$want\""*) ;; *) echo "expected reason $want"; exit 1 ;; esac
          }
          name=system-device-monitor_9.9.9_all.deb
          work=$(mktemp -d)
          mkdir "$work/link" "$work/big" "$work/root" "$work/beta"
          cp dist/*.deb "$work/$name"
          sha256sum "$work/$name" | sed "s|  .*|  $name|" > "$work/SHA256SUMS"
          printf 'AAAA\n' > "$work/SHA256SUMS.sig"
          sums="$work/SHA256SUMS"; sig="$work/SHA256SUMS.sig"
          expect 0 "$update" --protocol
          expect 2 sudo "$update"
          expect 2 sudo "$update" install
          expect 2 sudo env PKEXEC_UID="$(id -u)" "$update" install "$work/other.deb" "$sums" "$sig"
          expect 2 sudo env PKEXEC_UID="$(id -u)" "$update" install "$work/$name" "$sig" "$sums"
          expect 4 "$update" install "$work/$name" "$sums" "$sig"
          expect 4 sudo "$update" install "$work/$name" "$sums" "$sig"
          unsigned=$(/usr/bin/python3 -B -c 'from sdm.constants import Update; print("signature" if Update.PUBLIC_KEYS else "no-keys")')
          fails "$unsigned" "$work/$name" "$sums" "$sig"
          # 測試版只有加上 --allow-beta（使用者在手動檢查時選擇）才會往下檢查
          beta=system-device-monitor_9.9.9~beta.1_all.deb
          cp "$work/$name" "$work/beta/$beta"
          fails channel "$work/beta/$beta" "$sums" "$sig"
          fails "$unsigned" --allow-beta "$work/beta/$beta" "$sums" "$sig"
          ln -s "$work/$name" "$work/link/$name"
          fails input "$work/link/$name" "$sums" "$sig"
          truncate -s 31M "$work/big/$name"
          fails input "$work/big/$name" "$sums" "$sig"
          sudo install -m 644 "$work/$name" "$work/root/$name"
          fails input "$work/root/$name" "$sums" "$sig"
          sudo sh -c 'test ! -e /var/cache/system-device-monitor/staging || test -z "$(ls -A /var/cache/system-device-monitor/staging | grep -vx .lock)"'
          test "$(dpkg-query -W -f='${Version}' system-device-monitor)" = "$(cat VERSION)"
      - name: Smart charging components
        run: |
          set -eu
          wake=/usr/libexec/system-device-monitor/sdm-wake
          rules=/usr/libexec/system-device-monitor/sdm-unattended
          rule=/etc/polkit-1/rules.d/49-system-device-monitor.rules
          actions=/usr/share/polkit-1/actions
          expect() {
            want=$1; shift
            set +e; "$@"; got=$?; set -e
            if [ "$got" != "$want" ]; then echo "expected exit $want, got $got: $*"; exit 1; fi
          }
          as_wake() { sudo env PKEXEC_UID="$(id -u)" "$wake" "$@"; }
          as_rules() { sudo env PKEXEC_UID="$(id -u)" "$rules" "$@"; }
          one_json() { /usr/bin/python3 -c 'import json,sys; lines=sys.stdin.read().splitlines(); assert len(lines)==1, lines; print(json.loads(lines[0]))'; }
          for path in "$wake" "$rules"; do
            test "$(stat -c '%U %a' "$path")" = "root 755"
          done
          for path in "$actions/tw.local.system-device-monitor.unattended.wake.policy" "$actions/tw.local.system-device-monitor.rules.policy"; do
            test "$(stat -c '%U %a' "$path")" = "root 644"
          done
          check_action() {
            pkaction --verbose --action-id "$1" | tee "/tmp/pkaction-$1.txt"
            grep -Eq 'implicit any: *no$' "/tmp/pkaction-$1.txt"
            grep -Eq 'implicit inactive: *no$' "/tmp/pkaction-$1.txt"
            grep -Eq "implicit active: *$2\$" "/tmp/pkaction-$1.txt"
          }
          check_action tw.local.system-device-monitor.unattended.wake auth_admin_keep
          check_action tw.local.system-device-monitor.unattended.wake-clear auth_admin_keep
          check_action tw.local.system-device-monitor.unattended.charge-limit auth_admin_keep
          check_action tw.local.system-device-monitor.rules auth_admin
          check_action tw.local.system-device-monitor.unattended.status no
          grep -q 'exec.argv1 -> set$' /tmp/pkaction-tw.local.system-device-monitor.unattended.wake.txt
          grep -q 'exec.argv1 -> clear$' /tmp/pkaction-tw.local.system-device-monitor.unattended.wake-clear.txt
          grep -q 'exec.argv1 -> set$' /tmp/pkaction-tw.local.system-device-monitor.unattended.charge-limit.txt
          if grep -q 'exec.argv1' /tmp/pkaction-tw.local.system-device-monitor.rules.txt; then exit 1; fi
          expect 0 "$wake" --protocol
          expect 0 "$rules" --protocol
          # 參數錯誤一律結束碼 2（$args 刻意不加引號，以空白分成多個參數）
          for args in "set" "set 0" "set -1" "set 1e9" "set 01800000000" "set 1800000000.5" \
                      "set 1800000000 extra" "set 9999999999999" "clear now" "status x" "bogus"; do
            expect 2 as_wake $args
          done
          expect 2 as_wake set " 1800000000"
          expect 2 sudo "$wake"
          for args in "grant alice" "revoke x" "status x" "GRANT" "bogus"; do
            expect 2 as_rules $args
          done
          expect 2 sudo "$rules"
          expect 4 sudo "$wake" status
          expect 4 "$wake" clear
          expect 4 sudo "$rules" status
          expect 4 "$rules" grant
          as_wake status | one_json
          # 太近的時間一律拒絕（執行器沒有 RTC 時則是 no-rtc），標準輸出剛好一行 JSON
          set +e; out=$(as_wake set "$(( $(date +%s) + 30 ))"); got=$?; set -e
          test "$got" = 3
          printf '%s\n' "$out" | one_json
          # 無人授權規則：產生、範本的條件、polkit 載入時沒有錯誤、撤銷只刪那一個檔案
          as_rules status | grep -q '"granted":false'
          as_rules grant | grep -q '"ok":true'
          test "$(sudo stat -c '%U %a' "$rule")" = "root 644"
          sudo grep -qF "var user = \"$(id -un)\";" "$rule"
          sudo grep -qF "帳號 uid：$(id -u)" "$rule"
          # 命令列以樣式完整比對（不能多 --persist 等參數）
          for text in 'subject.local !== true' 'subject.active !== true' \
                      'action.lookup("program") !== program' 'action.lookup("user") !== "root"' \
                      'pattern.test(line)' '(5[0-9]|[6-9][0-9]|100)$/]' \
                      '"tw.local.system-device-monitor.unattended.charge-limit"' \
                      '"tw.local.system-device-monitor.unattended.wake-clear"'; do
            sudo grep -qF "$text" "$rule"
          done
          if sudo grep -qE '=>|\blet |\bconst |startsWith|indexOf|slice\(|cpu-power|\.update"' "$rule"; then exit 1; fi
          as_rules status | grep -q '"granted":true'
          as_rules status | grep -q '"account_changed":false'
          if systemctl is-active --quiet polkit; then
            sleep 3
            if sudo journalctl -u polkit --since "-2min" --no-pager | grep -i "49-system-device-monitor" | grep -qi error; then exit 1; fi
          fi
          # 執行器不是本機作用中的工作階段：規則存在也不會允許（只看結束碼：1 是不允許，127 是沒有這個動作）
          set +e; pkcheck --action-id tw.local.system-device-monitor.unattended.status --process $$; got=$?; set -e
          test "$got" = 1
          as_rules revoke | grep -q '"removed":true'
          sudo test ! -e "$rule"
          # 降級到沒有智慧充電的版本（0.3.0~ 以前）時 prerm 撤銷規則；升級到測試版時保留
          prerm=/var/lib/dpkg/info/system-device-monitor.prerm
          as_rules grant | grep -q '"ok":true'
          sudo "$prerm" upgrade 0.3.0~beta.1
          sudo test -e "$rule"
          # 重新安裝同一版時 dpkg 也以 upgrade 執行舊的 prerm：規則留著
          sudo "$prerm" upgrade "$(cat VERSION)"
          sudo test -e "$rule"
          sudo "$prerm" upgrade 0.2.0
          sudo test ! -e "$rule"
          # 執行器（虛擬機）有可用的 RTC 時：真的排定、取消，再留一個給 prerm 取消（只在 CI 執行）
          if [ -e /sys/class/rtc/rtc0/wakealarm ] && [ -z "$(cat /sys/class/rtc/rtc0/wakealarm)" ]; then
            epoch=$(( $(date +%s) + 3600 ))
            set +e; out=$(as_wake set "$epoch"); got=$?; set -e
            echo "$out"
            if [ "$got" = 0 ]; then
              test "$(cat /sys/class/rtc/rtc0/wakealarm)" = "$epoch"
              test "$(sudo stat -c '%U %a' /run/system-device-monitor/wake)" = "root 600"
              # 取消不受 10 秒的間隔限制；之後的 set 仍要等滿
              as_wake clear | grep -q '"cleared":true'
              test -z "$(cat /sys/class/rtc/rtc0/wakealarm)"
              sleep 11
              as_wake set "$epoch" | grep -q '"ok":true'
              echo "$epoch" > "$RUNNER_TEMP/sdm-wake-left"
            fi
          fi
          # 留下規則：移除套件時 prerm 必須刪除它
          as_rules grant | grep -q '"ok":true'
      - name: Remove and purge
        run: |
          set -eu
          sudo apt-get remove -y system-device-monitor
          test ! -e /var/lib/system-device-monitor/charge-limit.json
          test ! -e /run/system-device-monitor/charge-limit.lock
          test ! -e /run/system-device-monitor/charge-limit.times
          test ! -e /run/system-device-monitor/wake
          test ! -e /run/system-device-monitor/wake.lock
          test ! -e /run/system-device-monitor/wake.times
          test ! -e /run/system-device-monitor/unattended.lock
          sudo test ! -e /etc/polkit-1/rules.d/49-system-device-monitor.rules
          if [ -f "$RUNNER_TEMP/sdm-wake-left" ]; then test -z "$(cat /sys/class/rtc/rtc0/wakealarm)"; fi
          test ! -e /usr/bin/system-device-monitor
          test ! -e /usr/lib/systemd/system/system-device-monitor-cpu-power.socket
          test ! -e /usr/lib/systemd/system/system-device-monitor-cpu-power.service
          test ! -e /etc/systemd/system/system-device-monitor-cpu-power.socket.d
          test ! -e /etc/systemd/system/sockets.target.wants/system-device-monitor-cpu-power.socket
          test ! -e /usr/lib/systemd/system/system-device-monitor-charge-limit.service
          test ! -e /etc/systemd/system/multi-user.target.wants/system-device-monitor-charge-limit.service
          test ! -e /etc/systemd/system/sleep.target.wants/system-device-monitor-charge-limit.service
          test ! -e /run/system-device-monitor/cpu-power.sock
          test "$(systemctl is-active system-device-monitor-cpu-power.socket || true)" != "active"
          sudo apt-get purge -y system-device-monitor
          test ! -e /var/lib/system-device-monitor
          test ! -e /var/cache/system-device-monitor
          test ! -e /usr/share/polkit-1/actions/tw.local.system-device-monitor.update.policy
          test ! -e /usr/share/polkit-1/actions/tw.local.system-device-monitor.policy
          test ! -e /usr/share/polkit-1/actions/tw.local.system-device-monitor.unattended.charge-limit.policy
          test ! -e /usr/share/polkit-1/actions/tw.local.system-device-monitor.unattended.wake.policy
          test ! -e /usr/share/polkit-1/actions/tw.local.system-device-monitor.rules.policy
          test ! -e /usr/libexec/system-device-monitor
          if sudo ls /etc/polkit-1/rules.d | grep -q system-device-monitor; then exit 1; fi
          if dpkg-query -W system-device-monitor 2>/dev/null; then exit 1; fi
          # 套件列出的檔案、小程式、polkit 動作、規則檔、systemd 單元、/run 與 /var 的狀態都不能留下
          bash scripts/ci_leftovers.sh dist/system-device-monitor_"$(cat VERSION)"_all.deb
      - name: Upgrade from the last release
        run: |
          set -euo pipefail
          # 從最後一個發布的版本升級。GitHub 上的 Release 目前只有 v0.1.0；以它自己的建置腳本從 git 標籤
          # 重新建置（checkout 的 fetch-depth: 0 已經取得標籤），不需要下載權杖，內容由標籤固定。
          # 發布新版本之後把 previous 改成新的標籤。
          previous=v0.1.0
          git rev-parse --verify --quiet "refs/tags/$previous^{commit}" >/dev/null || { echo "missing tag $previous"; exit 1; }
          old="$RUNNER_TEMP/previous"
          mkdir "$old"
          git archive "$previous" | tar -x -C "$old"
          /usr/bin/python3 -B "$old/scripts/build_deb.py"
          old_deb="$old/dist/system-device-monitor_${previous#v}_all.deb"
          new_deb="dist/system-device-monitor_$(cat VERSION)_all.deb"
          sudo apt-get install -y "$old_deb"
          test "$(dpkg-query -W -f='${Version}' system-device-monitor)" = "${previous#v}"
          test -e /usr/share/system-device-monitor/runtime.py
          sudo apt-get install -y "./$new_deb"
          test "$(dpkg-query -W -f='${Version}' system-device-monitor)" = "$(cat VERSION)"
          test "$(/usr/bin/system-device-monitor --version)" = "System Device Monitor $(cat VERSION)"
          # 舊版才有的檔案已經換掉；升級不啟用任何服務，也不寫入無人授權的規則
          for name in app.py collectors.py model.py runtime.py; do
            test ! -e "/usr/share/system-device-monitor/$name"
          done
          test "$(systemctl is-enabled system-device-monitor-cpu-power.socket || true)" = "disabled"
          test "$(systemctl is-enabled system-device-monitor-charge-limit.service || true)" = "disabled"
          sudo test ! -e /etc/polkit-1/rules.d/49-system-device-monitor.rules
          sudo apt-get purge -y system-device-monitor
          bash scripts/ci_leftovers.sh "$old_deb" "$new_deb"
